plugins { id 'com.android.application' }

android {
    namespace 'com.attech.prayertimes'
    compileSdk 36
    defaultConfig {
        applicationId 'com.attech.prayertimes'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation files('libs/adhan-1.2.1.jar') }
